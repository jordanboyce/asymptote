# Remote deployment override — Asymptote behind Cloudflare Tunnel + Access.
#
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d --build
#
# This is deployment shape B from docs/DEPLOYMENT.md: the app publishes NO
# port; the only way in is the tunnel, and Cloudflare Access decides who gets
# through it. See docs/REMOTE-ACCESS.md for the one-time Cloudflare setup.
#
# Required in .env (next to this file):
#   TUNNEL_TOKEN=...     # from the Cloudflare Zero Trust tunnel you create
#   AUTH_PASSWORD=...    # belt-and-braces shared secret (long + random)

services:
  asymptote:
    # Override the base file's published port: the tunnel is the only route in.
    ports: !reset []
    expose:
      - "8473"
    environment:
      # Fail closed even if something reaches the container network directly:
      # every request (except /health) must carry this as Basic or Bearer auth.
      - AUTH_PASSWORD=${AUTH_PASSWORD:?set AUTH_PASSWORD in .env for remote deployments}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: asymptote-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env — see docs/REMOTE-ACCESS.md}
    depends_on:
      - asymptote
    restart: unless-stopped
