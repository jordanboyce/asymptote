services:
  finn:
    build:
      context: .
      # Dockerfile, not Dockerfile.corporate. This pointed at the corporate
      # variant, so `docker compose up -d --build` -- the documented
      # deployment command -- built an image that omits
      # `python -m spacy download en_core_web_lg`. Presidio loads that model
      # at runtime, so the container started clean and then failed on the
      # first redaction; redaction fails open, meaning client PII would reach
      # the model while the UI still reported the boundary as on.
      # Switch to Dockerfile.corporate only if you need custom CA certs, and
      # read the note at the top of that file first.
      dockerfile: Dockerfile
    container_name: finn-api
    ports:
      - "8000:8000"
    volumes:
      # Persist data directory (PDFs and indexes)
      - ./data:/app/data
    environment:
      # Override these in a .env file if needed
      - DATA_DIR=/app/data
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHUNK_SIZE=600
      - CHUNK_OVERLAP=100
      - DEFAULT_TOP_K=10
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
