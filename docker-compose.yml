services:
  asymptote:
    build:
      context: .
      dockerfile: Dockerfile.corporate
    container_name: asymptote-api
    ports:
      - "8473:8473"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    environment:
      # These override .env so the container always uses local sentence-transformers
      # for embeddings regardless of what .env says — Ollama embedding has hardware
      # requirements that make it impractical in the container.
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=8473
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8473/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hf_cache:
