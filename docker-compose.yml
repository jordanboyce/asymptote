# Asymptote — docker compose deployment.
#
#   docker compose up -d
#   open http://localhost:8473
#
# No .env required to start; drop one next to this file to override defaults
# (see .env.example). Documents and indexes persist in ./data.

services:
  asymptote:
    build: .
    container_name: asymptote
    ports:
      - "8473:8473"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=8473
      # Embeddings always run locally in the container (sentence-transformers);
      # external AI providers are configured in the app's Settings tab.
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      # Reach an Ollama instance on the docker host, if you run one
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Healthcheck comes from the Dockerfile (curl /health).
