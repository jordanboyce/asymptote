# Asymptote — docker compose deployment.
#
#   docker compose up -d
#   open http://localhost:8473
#
# NOTE: `up -d` only builds the image the FIRST time. After pulling or
# changing code, rebuild explicitly:  docker compose up -d --build
#
# No .env required to start; drop one next to this file to override defaults
# (see .env.example). Documents and indexes persist in ./data.

services:
  asymptote:
    build:
      context: .
      # Air-gapped deployments: bake ALL runtime models (reranker, Whisper,
      # Docling OCR) into the image so nothing is downloaded after build.
      # Uncomment, build on a connected machine, then `docker save` the image
      # and `docker load` it inside the air gap — see docs/AIRGAP.md.
      # args:
      #   OFFLINE_BUNDLE: "1"
    container_name: asymptote
    ports:
      - "8473:8473"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=8473
      # Embeddings always run locally in the container (sentence-transformers);
      # external AI providers are configured in the app's Settings tab.
      - EMBEDDING_PROVIDER=local
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      # Reach an Ollama instance on the docker host, if you run one
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Air-gapped mode: disables cloud AI providers and every HuggingFace
      # download — the container makes no outbound connections beyond the
      # Ollama/self-hosted endpoints you configure. See docs/AIRGAP.md.
      # - OFFLINE_MODE=1
      # Shared-secret auth: require this password (Basic or Bearer) on every
      # request. Recommended whenever others can reach the port.
      # - AUTH_PASSWORD=change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Healthcheck comes from the Dockerfile (curl /health).
