# Pershing / NetX360 export profiles
# Covers: flat Unrealized G/L (compatible with P0.1 header detection)
#
# NetX360 "Holdings by Investor" (HBIL*.csv) is hierarchical and handled
# by a dedicated Python preprocessor — see netx360.yaml / netx360.py.

- vendor: pershing
  display_name: "Pershing — Unrealized G/L (flat)"
  file_signatures:
    filename_patterns:
      - "*Unrealized*Gain*Loss*"
      - "*unrealized*gain*loss*"
      - "*Unrealized*GL*"
      - "*unrealized*gl*"
    required_strings:
      - "Unrealized Gain Loss"
    column_hints:
      - "Security Description"
      - "Security Identifier"
      - "Quantity"
      - "Last Price"
      - "Market Value"
      - "Current Total Cost"
      - "Gain/Loss"
  column_roles:
    "Symbol": ticker
    "Security Identifier": cusip
    "Security Description": name
    "Quantity": quantity
    "Last Price": price
    "Market Value": market_value
    "Current Total Cost": cost_basis
    "Unit Cost": unit_cost
    "Gain/Loss": pnl
    "Gain/Loss %": return
    "Security Type": asset_class
    "% of Portfolio": weight
    "Trade Date": trade_date
  type_overrides:
    "Quantity": real
    "Last Price": real
    "Market Value": currency
    "Current Total Cost": currency
    "Unit Cost": real
    "Gain/Loss": currency
    "Gain/Loss %": percent
    "% of Portfolio": percent
    "Projected Annual Income": currency
    "Current Yield": percent
    "Original Total Cost": currency
    "Original Adjusted Cost": currency
    "Original Quantity": real
    "Interest": currency
  # Strip the TOTAL footer row and any Disclaimers rows
  drop_rows_where_col_value_in:
    column: "Security Identifier"
    values:
      - "TOTAL"
