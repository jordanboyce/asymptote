# Asymptote Enterprise — Nginx Reverse Proxy
# Security headers, rate limiting, upload handling
# TLS is optional — just mount certs to /etc/nginx/ssl/ to enable

# ── Rate limiting zones ──────────────────────────────────────
# Shared memory zones: 10 MB ≈ ~160 000 unique IPs
limit_req_zone $binary_remote_addr zone=api_rate:10m      rate=30r/s;
limit_req_zone $binary_remote_addr zone=upload_rate:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=search_rate:10m   rate=20r/s;

# ── Upstream ─────────────────────────────────────────────────
upstream asymptote_backend {
    server asymptote-api:8473;
    keepalive 32;
}

# ── Main HTTP server ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection       "1; mode=block"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── Client body size (document uploads) ──────────────────
    client_max_body_size 500m;

    # ── Timeouts ─────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    300s;   # long for large document indexing
    proxy_send_timeout    300s;
    send_timeout          300s;

    # ── Common proxy headers ─────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ── Static assets (cached) ───────────────────────────────
    location /assets/ {
        proxy_pass http://asymptote_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Document upload endpoints (stricter rate limit) ──────
    location ~ ^/documents/upload {
        limit_req zone=upload_rate burst=10 nodelay;
        proxy_pass http://asymptote_backend;
        proxy_request_buffering off;     # stream large files
    }

    # ── Search endpoints ─────────────────────────────────────
    location /search {
        limit_req zone=search_rate burst=40 nodelay;
        proxy_pass http://asymptote_backend;
    }

    # ── SSE / streaming (upload progress, chat) ──────────────
    location ~ ^/api/(upload-progress|chat) {
        proxy_pass http://asymptote_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ── API endpoints ────────────────────────────────────────
    location /api/ {
        limit_req zone=api_rate burst=60 nodelay;
        proxy_pass http://asymptote_backend;
    }

    # ── Health check (no rate limit) ─────────────────────────
    location /health {
        proxy_pass http://asymptote_backend;
        access_log off;
    }

    # ── Everything else (Web UI, docs, etc.) ─────────────────
    location / {
        limit_req zone=api_rate burst=60 nodelay;
        proxy_pass http://asymptote_backend;
    }

    # ── Deny dotfiles ────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}

